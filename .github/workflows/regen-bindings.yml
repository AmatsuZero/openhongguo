name: regen-bindings

# Run `make gen` on CI and commit when bindings/docs drift (e.g. after sdk API edits).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/mobile/core/go.mod
          cache-dependency-path: bindings/mobile/core/go.sum

      - name: make gen
        run: make gen

      - name: Commit regenerated files
        run: |
          git config user.name "openhongguo-ci"
          git config user.email "ci@openhongguo.local"
          git add bindings docs/types.md
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "ci: regenerate bindings (make gen)"
          git push origin HEAD:main
